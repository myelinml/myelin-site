name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy must be separate jobs. deploy-pages lists artifacts as
# soon as it starts; in the same job as the upload that list is often still
# empty (actions/deploy-pages#451).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore official logo pack and stage the site
        run: |
          set -euo pipefail
          base64 -d pack/myelin-logos.zip.b64 > logos/myelin-logos.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("logos/myelin-logos.zip")
          bad = z.testzip()
          if bad:
              raise SystemExit(f"corrupt zip member: {bad}")
          for info in z.infolist():
              if info.is_dir():
                  continue
              if info.filename.startswith("png/") and info.filename.endswith(".png"):
                  dest = "logos/" + info.filename.split("/")[-1]
                  with z.open(info) as src, open(dest, "wb") as out:
                      out.write(src.read())
                  print("restored", dest)
          print("zip ok logos/myelin-logos.zip")
          PY
          mkdir -p published
          cp index.html styles.css main.js favicon.svg .nojekyll published/
          cp -a logos published/logos
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: published

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
