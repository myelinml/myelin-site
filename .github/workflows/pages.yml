name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# First-time setup: GitHub's GITHUB_TOKEN cannot enable Pages (POST /pages returns 403).
# Enable it once at https://github.com/baiehclaca/myelin-site/settings/pages
# Source: GitHub Actions. Then re-run this workflow, or push to main.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore official logo pack and stage the site
        run: |
          set -euo pipefail
          base64 -d pack/myelin-logos.zip.b64 > logos/myelin-logos.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("logos/myelin-logos.zip")
          bad = z.testzip()
          if bad:
              raise SystemExit(f"corrupt zip member: {bad}")
          for info in z.infolist():
              if info.is_dir():
                  continue
              if info.filename.startswith("png/") and info.filename.endswith(".png"):
                  dest = "logos/" + info.filename.split("/")[-1]
                  with z.open(info) as src, open(dest, "wb") as out:
                      out.write(src.read())
                  print("restored", dest)
          print("zip ok logos/myelin-logos.zip")
          PY
          mkdir -p published
          cp index.html styles.css main.js favicon.svg .nojekyll published/
          cp -a logos published/logos
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: published
      - id: deployment
        uses: actions/deploy-pages@v4
